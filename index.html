<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Salah</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="My Salah">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">

<style>
:root{--bg:#000000;--panel:#0b0b0b;--card:#161616;--line:#3a3a3a;--muted:#9b9b9b;--accent:#ffffff;--tan:#e8e8e8;--text:#f5f5f5;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:Helvetica,Arial,sans-serif;min-height:100vh}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;opacity:.7;transition:opacity 1.2s;background:radial-gradient(40% 35% at 20% 15%,rgba(255,255,255,.16),transparent 70%),radial-gradient(35% 30% at 85% 80%,rgba(255,255,255,.12),transparent 70%),radial-gradient(30% 25% at 60% 45%,rgba(255,255,255,.07),transparent 70%);animation:drift 14s ease-in-out infinite alternate}
body.done::before{opacity:1}
@keyframes drift{from{transform:translate3d(-2%,-1%,0) scale(1)}to{transform:translate3d(3%,2%,0) scale(1.12)}}
.wrap{max-width:980px;margin:0 auto;padding:22px 16px 40px}
h1{margin:0;font-size:clamp(36px,8vw,54px);line-height:1;color:var(--tan)}
.sub{margin:10px 0 0;font-size:13px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--accent)}
.rule{height:1px;background:var(--line);margin:18px 0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:var(--card);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-size:26px;line-height:1.1}
.stat span{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.lvl{margin-top:12px;background:var(--card);border-radius:14px;padding:12px 14px}
.lvl .t{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:8px}
.bar{height:8px;border-radius:8px;background:var(--bg);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),#cfcfcf);border-radius:8px;transition:width .7s cubic-bezier(.2,.9,.3,1)}
.grid{display:grid;grid-template-columns:1.15fr 1fr;gap:16px;margin-top:16px}
.dayhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
.dayhead h2{margin:0;font-size:15px;color:var(--tan);letter-spacing:.04em}
.pill{background:rgba(255,255,255,.14);color:var(--accent);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:700;white-space:nowrap}
.prayers{display:flex;flex-direction:column;gap:10px}
.p{position:relative;display:flex;align-items:center;background:var(--card);border-radius:16px;overflow:hidden;cursor:pointer;min-height:76px;user-select:none;-webkit-user-select:none;border:0;color:inherit;font:inherit;text-align:left;width:100%;padding:0;transition:transform .15s,background .3s}
.p:active{transform:scale(.97)}
.p .tb{width:104px;align-self:stretch;flex:none;background:rgba(255,255,255,.12);border-left:7px solid var(--accent);padding-left:14px;display:flex;flex-direction:column;justify-content:center;transition:background .3s,border-color .3s}
.p .ar{font-size:24px;font-weight:700;line-height:1}
.p .pts{font-size:10.5px;color:var(--muted);margin-top:7px}
.p .nm{flex:1;padding:0 12px 0 20px;font-size:24px;font-weight:700}
.chk{flex:none;margin-right:18px;width:38px;height:38px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;transition:all .3s}
.chk svg{width:22px;height:22px;stroke:#000000;stroke-width:3.5;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:30;stroke-dashoffset:30;transition:stroke-dashoffset .4s .1s}
.p.on{background:#262626}
.p.on .tb{background:var(--accent);border-color:#cfcfcf}
.p.on .tb .ar,.p.on .tb .pts{color:#000000}
.p.on .chk{background:var(--accent);border-color:var(--accent);transform:scale(1.08)}
.p.on .chk svg{stroke-dashoffset:0}
.p.pop .chk{animation:pop .5s}
.p::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--x,80%) 50%,rgba(255,255,255,.45),transparent 55%);opacity:0;pointer-events:none}
.p.pop::after{animation:rip .7s}
@keyframes pop{0%{transform:scale(.6)}50%{transform:scale(1.45)}100%{transform:scale(1.08)}}
@keyframes rip{0%{opacity:1}100%{opacity:0}}
.p.locked{opacity:.55;cursor:default}
.float{position:fixed;font-weight:800;color:var(--accent);pointer-events:none;z-index:60;animation:fl 1s ease-out forwards;font-size:20px}
@keyframes fl{to{transform:translateY(-60px);opacity:0}}
.bonus{margin-top:10px;border:1.4px dashed var(--line);border-radius:12px;padding:11px 14px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:center;transition:all .4s}
.bonus.on{border-style:solid;border-color:var(--accent);color:var(--accent);background:rgba(255,255,255,.12);animation:glow 1.6s}
@keyframes glow{0%,100%{box-shadow:0 0 0}40%{box-shadow:0 0 28px rgba(255,255,255,.6)}}
.cal{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;align-self:start}
.calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calh b{color:var(--tan);font-size:15px}
.calh button{background:transparent;border:1px solid var(--line);color:var(--text);border-radius:10px;width:34px;height:34px;font-size:16px;cursor:pointer}
.calh button:hover{background:#262626}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dw{font-size:10px;text-align:center;color:var(--muted);text-transform:uppercase;padding-bottom:2px}
.d{aspect-ratio:1;border-radius:10px;background:var(--card);border:1.5px solid transparent;color:var(--text);font:inherit;font-size:13px;cursor:pointer;position:relative;display:grid;place-items:center;padding:0}
.d:hover{border-color:var(--line)}
.d.e{background:transparent;cursor:default;border:0}
.d.f{opacity:.35;cursor:default}
.d.part{background:rgba(255,255,255,.22)}
.d.full{background:var(--accent);color:#000000;font-weight:700}
.d.today{border-color:var(--tan)}
.d.sel{outline:2px solid var(--text);outline-offset:1px}
.d small{position:absolute;bottom:3px;font-size:8px;letter-spacing:1px}
.leg{display:flex;gap:14px;margin-top:12px;font-size:11px;color:var(--muted);flex-wrap:wrap}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.foot{margin-top:18px;text-align:center}
.foot button{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:7px 12px;font-size:12px;cursor:pointer}
.conf{position:fixed;top:-10px;width:9px;height:14px;z-index:70;pointer-events:none;animation:cf linear forwards}
@keyframes cf{to{transform:translate(var(--dx),105vh) rotate(var(--r));opacity:.9}}
@media(max-width:760px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div class="wrap">
  <h1>MY SALAH</h1>
  <p class="sub">Daily Prayer Tracker</p>
  <div class="rule"></div>

  <div class="stats">
    <div class="stat"><b id="sPts">0</b><span>Total points</span></div>
    <div class="stat"><b id="sStreak">0</b><span>Current streak</span></div>
    <div class="stat"><b id="sBest">0</b><span>Best streak</span></div>
    <div class="stat"><b id="sPerfect">0</b><span>Perfect days</span></div>
  </div>
  <div class="lvl"><div class="t"><span id="lvlName">Level 1</span><span id="lvlNext"></span></div><div class="bar"><i id="lvlBar"></i></div></div>

  <div class="grid">
    <section>
      <div class="dayhead"><h2 id="dayTitle"></h2><span class="pill" id="dayPill"></span></div>
      <div class="prayers" id="prayers"></div>
      <div class="bonus" id="bonus">Complete all five for +20 bonus</div>
    </section>
    <section class="cal">
      <div class="calh"><button id="prev" aria-label="Previous month">‹</button><b id="monthTitle"></b><button id="next" aria-label="Next month">›</button></div>
      <div class="cg" id="cal"></div>
      <div class="leg"><span><i style="background:var(--accent)"></i>All 5</span><span><i style="background:rgba(255,255,255,.4)"></i>Some</span><span><i style="background:var(--card)"></i>None</span></div>
    </section>
  </div>
  <div class="foot"><button id="exp">Export backup</button> <button id="imp">Import backup</button> <button id="reset">Reset all data</button>
<input type="file" id="file" accept="application/json,.json" hidden></div>
</div>

<script>
const PR=[["Fajr","الفجر"],["Dhuhr","الظهر"],["Asr","العصر"],["Maghrib","المغرب"],["Isha","العشاء"]];
const PTS=10,BONUS=20,KEY="prayerTracker.v1";
let data={};try{data=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}};
const $=id=>document.getElementById(id);
const key=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=new Date(),todayK=key(today);
let sel=todayK,view=new Date(today.getFullYear(),today.getMonth(),1);
const get=k=>data[k]||[0,0,0,0,0];
const cnt=k=>get(k).reduce((a,b)=>a+b,0);
const dayPts=k=>cnt(k)*PTS+(cnt(k)===5?BONUS:0);
const LV=["Beginner","Steadfast","Devoted","Guardian","Beacon","Luminary"];

function stats(){
  const ks=Object.keys(data);
  const pts=ks.reduce((a,k)=>a+dayPts(k),0);
  const perfect=ks.filter(k=>cnt(k)===5).length;
  let best=0,run=0,prev=null;
  ks.filter(k=>cnt(k)===5).sort().forEach(k=>{
    const d=new Date(k+"T00:00:00");
    run=(prev&&Math.round((d-prev)/864e5)===1)?run+1:1;prev=d;best=Math.max(best,run);
  });
  let cur=0,d=new Date(today);
  if(cnt(key(d))!==5)d.setDate(d.getDate()-1);
  while(cnt(key(d))===5){cur++;d.setDate(d.getDate()-1)}
  return{pts,perfect,best,cur};
}
function countUp(el,to){
  const from=+el.dataset.v||0;el.dataset.v=to;
  const t0=performance.now();
  (function f(t){const p=Math.min(1,(t-t0)/600);el.textContent=Math.round(from+(to-from)*p);if(p<1)requestAnimationFrame(f)})(t0);
}
function renderStats(){
  const s=stats();
  countUp($("sPts"),s.pts);countUp($("sStreak"),s.cur);countUp($("sBest"),s.best);countUp($("sPerfect"),s.perfect);
  const lvl=Math.floor(s.pts/250),inL=s.pts%250;
  $("lvlName").textContent="Level "+(lvl+1)+" · "+LV[Math.min(lvl,LV.length-1)];
  $("lvlNext").textContent=(250-inL)+" pts to next level";
  $("lvlBar").style.width=(inL/250*100)+"%";
}
function renderDay(){
  const k=sel,arr=get(k),future=k>todayK;
  const d=new Date(k+"T00:00:00");
  $("dayTitle").textContent=(k===todayK?"Today · ":"")+d.toLocaleDateString("en-US",{weekday:"long",month:"short",day:"numeric"});
  $("dayPill").textContent=cnt(k)+"/5 · "+dayPts(k)+" pts";
  const box=$("prayers");box.innerHTML="";
  PR.forEach((p,i)=>{
    const b=document.createElement("button");
    b.className="p"+(arr[i]?" on":"")+(future?" locked":"");
    b.innerHTML=`<div class="tb"><div class="ar">${p[1]}</div><div class="pts">+${PTS} pts</div></div><div class="nm">${p[0]}</div><div class="chk"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>`;
    b.onclick=e=>toggle(i,b,e);
    box.appendChild(b);
  });
  const all=cnt(k)===5;document.body.classList.toggle("done",all);
  $("bonus").className="bonus"+(all?" on":"");
  $("bonus").textContent=all?"✦ All five completed · +"+BONUS+" bonus ✦":"Complete all five for +"+BONUS+" bonus";
}
function toggle(i,btn,e){
  if(sel>todayK)return;
  const arr=get(sel).slice(),was=cnt(sel);
  arr[i]=arr[i]?0:1;data[sel]=arr;save();
  if(arr[i]){
    const r=btn.getBoundingClientRect();
    btn.style.setProperty("--x",(e.clientX-r.left)+"px");
    floatText("+"+PTS,e.clientX,e.clientY);
  }
  renderDay();
  if(arr[i]){const nb=$("prayers").children[i];nb.classList.add("pop");setTimeout(()=>nb.classList.remove("pop"),800)}
  if(cnt(sel)===5&&was<5){floatText("+"+BONUS+" bonus!",e.clientX,e.clientY-30);confetti()}
  renderStats();renderCal();
}
function floatText(t,x,y){
  const f=document.createElement("div");f.className="float";f.textContent=t;
  f.style.left=(x-14)+"px";f.style.top=(y-20)+"px";document.body.appendChild(f);setTimeout(()=>f.remove(),1000);
}
function confetti(){
  const cols=["#ffffff","#f5f5f5","#e8e8e8","#cfcfcf","#8a8a8a"];
  for(let i=0;i<60;i++){
    const c=document.createElement("div");c.className="conf";
    c.style.left=Math.random()*100+"vw";c.style.background=cols[i%5];
    c.style.setProperty("--dx",(Math.random()*160-80)+"px");
    c.style.setProperty("--r",(Math.random()*900-450)+"deg");
    c.style.animationDuration=(1.8+Math.random()*1.6)+"s";c.style.animationDelay=Math.random()*.4+"s";
    c.style.borderRadius=Math.random()>.5?"50%":"2px";
    document.body.appendChild(c);setTimeout(()=>c.remove(),4200);
  }
}
function renderCal(){
  const y=view.getFullYear(),m=view.getMonth();
  $("monthTitle").textContent=view.toLocaleDateString("en-US",{month:"long",year:"numeric"});
  const g=$("cal");g.innerHTML="";
  ["S","M","T","W","T","F","S"].forEach(x=>{const e=document.createElement("div");e.className="dw";e.textContent=x;g.appendChild(e)});
  const first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
  for(let i=0;i<first;i++){const e=document.createElement("div");e.className="d e";g.appendChild(e)}
  for(let n=1;n<=days;n++){
    const k=key(new Date(y,m,n)),c=cnt(k);
    const b=document.createElement("button");
    b.className="d"+(c===5?" full":c>0?" part":"")+(k===todayK?" today":"")+(k===sel?" sel":"")+(k>todayK?" f":"");
    b.innerHTML=n+(c>0&&c<5?`<small>${c}/5</small>`:"");
    if(k<=todayK)b.onclick=()=>{sel=k;renderDay();renderCal()};
    g.appendChild(b);
  }
}
$("prev").onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);renderCal()};
$("next").onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);renderCal()};
$("reset").onclick=()=>{if(confirm("Delete all your saved prayers and points?")){data={};save();renderAll()}};
function renderAll(){renderDay();renderCal();renderStats()}
renderAll();

async function exportData(){
  const text=JSON.stringify({app:"prayerTracker",v:1,data:data},null,1);
  const name="salah-backup-"+todayK+".json";
  try{
    const f=new File([text],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:"Salah backup"});return}
  }catch(e){if(e&&e.name==="AbortError")return}
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([text],{type:"application/json"}));
  a.download=name;document.body.appendChild(a);a.click();a.remove();
}
function importData(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const o=JSON.parse(r.result),d=o.data||o,clean={};
      Object.keys(d).forEach(k=>{if(/^\d{4}-\d{2}-\d{2}$/.test(k)&&Array.isArray(d[k])&&d[k].length===5)clean[k]=d[k].map(x=>x?1:0)});
      const n=Object.keys(clean).length;
      if(!n){alert("No prayer data found in that file.");return}
      if(!confirm("Replace your current data with "+n+" saved days from this backup?"))return;
      data=clean;save();renderAll();
    }catch(e){alert("That file could not be read.")}
  };
  r.readAsText(file);
}
$("exp").onclick=exportData;
$("imp").onclick=()=>$("file").click();
$("file").onchange=e=>{if(e.target.files[0])importData(e.target.files[0]);e.target.value=""};
if("serviceWorker" in navigator&&location.protocol.startsWith("http")){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
</body>
</html>
